#:schema https://schemastore.org/treefmt.json

allow-missing-formatter = false
excludes = ["_ISO/*", "files/*", "tools/*", "ventoy/themes/*"]

[formatter.typos]
command = "typos"
options = ["--write-changes"]
includes = ["*"]

[formatter.biome]
command = "biome"
options = ["format", "--write"]
includes = ["*.json", "*.jsonc", "*.yaml", "*.md"]

[formatter.tombi]
command = "tombi"
options = ["format"]
includes = ["*.toml"]

[formatter.shfmt]
command = "shfmt"
options = ["--write"]
includes = ["*.sh", "*.bash"]

[formatter.fish_indent]
command = "fish_indent"
options = ["--write"]
includes = ["*.fish"]

[formatter.nufmt]
command = "nufmt"
includes = ["*.nu", "*.nuon"]

[formatter.psfmt]
command = "psfmt"
options = ["--write"]
includes = ["*.ps1", "*.psd1", "*.psm1"]

[formatter.just]
command = "just"
options = ["--format", "--justfile"]
includes = ["*.just", "justfile", "**/justfile"]

[formatter.nixfmt]
command = "nixfmt"
includes = ["*.nix"]
